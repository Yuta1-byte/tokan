<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>灯環 ─ TŌKAN II</title>
<style>
  :root{
    --void:#04060e;
    --beam:#78e6ff;
    --ember:#ffd27a;
    --ash:#8fa3c0;
    --blood:#ff6a6a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--void);}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP",serif;
    color:#e8f2ff;-webkit-font-smoothing:antialiased;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  canvas{display:block;position:fixed;inset:0;}

  /* ── 画面効果 ── */
  #tint{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;
    background:radial-gradient(120% 80% at 50% 50%,transparent 40%,rgba(120,230,255,.16) 100%);}
  #tint.slow{opacity:1;}
  #wound{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(110% 75% at 50% 50%,transparent 35%,rgba(255,60,60,.55) 100%);}

  /* ── HUD ── */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;}
  #hud.on{opacity:1;}
  .corner{position:absolute;padding:16px 18px;}
  #score{top:env(safe-area-inset-top,0);left:0;}
  .lbl{font-size:10px;letter-spacing:.34em;color:var(--ash);margin-bottom:4px;}
  .num{font-family:"SF Mono",Menlo,monospace;font-size:30px;letter-spacing:.02em;
       font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(120,230,255,.5);}
  #combo{top:env(safe-area-inset-top,0);right:0;text-align:right;transition:opacity .3s;}
  #combo .num{font-size:22px;color:var(--ember);text-shadow:0 0 18px rgba(255,210,122,.5);}
  #combo.hide{opacity:0;}
  #chapter{position:absolute;top:calc(env(safe-area-inset-top,0) + 72px);left:18px;
    font-size:11px;letter-spacing:.42em;color:var(--ash);}

  #lampWrap{position:absolute;left:0;right:0;bottom:0;
    padding:0 18px calc(18px + env(safe-area-inset-bottom,0));}
  #lampRail{height:2px;background:rgba(143,163,192,.18);position:relative;}
  #lampFill{position:absolute;left:0;top:-1px;height:4px;width:100%;
    background:linear-gradient(90deg,rgba(120,230,255,.25),var(--beam));
    box-shadow:0 0 14px var(--beam);transition:width .16s linear,background .3s,box-shadow .3s;}
  #lampFill.low{background:linear-gradient(90deg,rgba(255,120,120,.3),var(--blood));box-shadow:0 0 16px var(--blood);}
  #lampTick{position:absolute;left:20%;top:-4px;width:1px;height:10px;background:rgba(232,242,255,.45);}
  #lampTxt{font-size:10px;letter-spacing:.34em;color:var(--ash);margin-bottom:8px;}

  #call{position:absolute;top:50%;left:0;right:0;text-align:center;
    transform:translateY(-118px);font-size:15px;letter-spacing:.5em;text-indent:.5em;
    opacity:0;color:var(--ember);text-shadow:0 0 22px rgba(255,210,122,.75);}
  #call.pop{animation:pop .75s ease-out;}
  @keyframes pop{0%{opacity:0;transform:translateY(-118px) scale(.82);}
                 16%{opacity:1;transform:translateY(-124px) scale(1);}
                 100%{opacity:0;transform:translateY(-146px) scale(1.02);}}

  #banner{position:absolute;top:50%;left:0;right:0;text-align:center;
    font-size:30px;letter-spacing:.42em;text-indent:.42em;opacity:0;
    text-shadow:0 0 34px rgba(120,230,255,.6);}
  #banner.show{animation:ban 2.1s ease-out;}
  @keyframes ban{0%{opacity:0;letter-spacing:.9em;}
                 22%{opacity:1;letter-spacing:.42em;}
                 70%{opacity:1;}100%{opacity:0;}}

  /* 残光ボタン */
  #slowBtn{position:fixed;left:18px;bottom:calc(46px + env(safe-area-inset-bottom,0));
    width:74px;height:74px;border-radius:50%;pointer-events:auto;
    border:1px solid rgba(120,230,255,.5);background:rgba(10,20,36,.5);
    color:#eaf6ff;font-family:inherit;display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;cursor:pointer;
    transition:opacity .2s,box-shadow .2s,transform .1s;}
  #hud.on #slowBtn{display:flex;}
  #slowBtn:active{transform:scale(.94);}
  #slowBtn .t{font-size:14px;letter-spacing:.16em;text-indent:.16em;}
  #slowBtn .c{font-size:9px;letter-spacing:.1em;color:var(--ash);}
  #slowBtn.ready{box-shadow:0 0 26px rgba(120,230,255,.35);}
  #slowBtn.cold{opacity:.3;}

  #mute{position:fixed;right:16px;bottom:calc(46px + env(safe-area-inset-bottom,0));
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(143,163,192,.35);
    background:transparent;color:var(--ash);font-size:13px;font-family:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;}

  /* ── 幕 ── */
  #veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:30px;transition:opacity .6s;
    background:radial-gradient(120% 90% at 50% 45%,rgba(6,10,22,.5),rgba(4,6,14,.96));}
  #veil.gone{opacity:0;pointer-events:none;}
  .kanji{font-size:54px;letter-spacing:.3em;text-indent:.3em;line-height:1;
    text-shadow:0 0 40px rgba(120,230,255,.45);}
  .roman{margin-top:14px;font-family:"SF Mono",Menlo,monospace;font-size:11px;
    letter-spacing:.6em;text-indent:.6em;color:var(--beam);}
  .rule{width:54px;height:1px;background:rgba(120,230,255,.4);margin:24px auto;}
  .lede{font-size:14px;line-height:2.1;color:#cddcf0;}
  .legend{margin:22px auto 0;text-align:left;display:inline-block;
    font-size:12px;line-height:2.1;color:#b9cbe2;}
  .legend b{font-weight:normal;display:inline-block;width:5.2em;letter-spacing:.1em;}
  .legend .cy{color:var(--beam);} .legend .go{color:var(--ember);} .legend .rd{color:var(--blood);}
  .keys{margin-top:20px;font-size:11px;line-height:2.2;color:var(--ash);letter-spacing:.12em;}
  button.act{
    margin-top:26px;padding:14px 40px;background:transparent;color:#eaf6ff;
    border:1px solid rgba(120,230,255,.55);border-radius:999px;
    font-family:inherit;font-size:14px;letter-spacing:.36em;text-indent:.36em;cursor:pointer;
    transition:background .25s,box-shadow .25s;}
  button.act:hover,button.act:focus-visible{background:rgba(120,230,255,.12);
    box-shadow:0 0 30px rgba(120,230,255,.3);outline:none;}
  .stats{display:flex;gap:26px;justify-content:center;margin-top:22px;flex-wrap:wrap;}
  .stat .lbl{margin-bottom:6px;} .stat .num{font-size:23px;}
  @media (prefers-reduced-motion:reduce){#call.pop,#banner.show{animation-duration:.01s;}}
  @media (max-width:420px){.kanji{font-size:42px;}.lede{font-size:13px;}.legend{font-size:11px;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tint"></div>
<div id="wound"></div>

<div id="hud">
  <div class="corner" id="score"><div class="lbl">光</div><div class="num" id="scoreN">0</div></div>
  <div class="corner hide" id="combo"><div class="lbl">連</div><div class="num" id="comboN">×1</div></div>
  <div id="chapter">第一章 蒼</div>
  <div id="call"></div>
  <div id="banner"></div>
  <div id="lampWrap">
    <div id="lampTxt">灯</div>
    <div id="lampRail"><div id="lampFill"></div><div id="lampTick"></div></div>
  </div>
  <button id="slowBtn"><span class="t">残光</span><span class="c">灯 -20</span></button>
</div>

<button id="mute" aria-label="音を切り替える">♪</button>

<div id="veil"><div id="veilBody">
  <div class="kanji">灯環</div>
  <div class="roman">TOKAN II</div>
  <div class="rule"></div>
  <div class="lede">光の輪を、くぐり抜ける。<br>芯を射抜くほど、光は遠くまで届く。</div>
  <div class="legend">
    <div><b class="cy">蒼環</b>くぐる。中心ほど高得点</div>
    <div><b class="go">金環</b>大量の光と灯</div>
    <div><b class="cy">閂環</b>回る棒を避けてくぐる</div>
    <div><b class="rd">封環</b>塞がれている。掠めるほど加点</div>
  </div>
  <div class="keys">ドラッグ／矢印キーで舵をとる<br>残光ボタン・スペースで時を緩める（灯を消費）</div>
  <button class="act" id="go">はじめる</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ══════════════════════════════ 基盤
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.autoClear = false;

var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x04060e, 40, 430);
var camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 700);
camera.position.set(0, 1.0, 7.2);

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

// ══════════════════════════════ ブルーム（自前の簡易合成）
var bloomOK = false;
var rtScene, rtA, rtB, quadScene, quadCam, quadMesh, mBright, mBlur, mCopy, mComp;
var dbSize = new THREE.Vector2();

var VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.0,1.0); }';

try{
  renderer.getDrawingBufferSize(dbSize);
  var opt = {minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
             format:THREE.RGBAFormat, stencilBuffer:false};
  rtScene = new THREE.WebGLRenderTarget(dbSize.x, dbSize.y, opt);
  rtA = new THREE.WebGLRenderTarget(Math.max(2,dbSize.x>>1), Math.max(2,dbSize.y>>1), opt);
  rtB = new THREE.WebGLRenderTarget(Math.max(2,dbSize.x>>1), Math.max(2,dbSize.y>>1), opt);
  rtA.depthBuffer = false; rtB.depthBuffer = false;

  mBright = new THREE.ShaderMaterial({
    uniforms:{tDiffuse:{value:null}, threshold:{value:0.34}},
    vertexShader:VERT,
    fragmentShader:
      'uniform sampler2D tDiffuse; uniform float threshold; varying vec2 vUv;' +
      'void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb;' +
      ' float l = dot(c, vec3(0.2126,0.7152,0.0722));' +
      ' float k = smoothstep(threshold, threshold+0.4, l);' +
      ' gl_FragColor = vec4(c*k, 1.0); }',
    depthTest:false, depthWrite:false
  });
  mBlur = new THREE.ShaderMaterial({
    uniforms:{tDiffuse:{value:null}, dir:{value:new THREE.Vector2(0,0)}},
    vertexShader:VERT,
    fragmentShader:
      'uniform sampler2D tDiffuse; uniform vec2 dir; varying vec2 vUv;' +
      'void main(){ vec4 s = vec4(0.0);' +
      ' s += texture2D(tDiffuse, vUv - dir*4.0)*0.0162;' +
      ' s += texture2D(tDiffuse, vUv - dir*3.0)*0.0540;' +
      ' s += texture2D(tDiffuse, vUv - dir*2.0)*0.1216;' +
      ' s += texture2D(tDiffuse, vUv - dir      )*0.1946;' +
      ' s += texture2D(tDiffuse, vUv            )*0.2270;' +
      ' s += texture2D(tDiffuse, vUv + dir      )*0.1946;' +
      ' s += texture2D(tDiffuse, vUv + dir*2.0)*0.1216;' +
      ' s += texture2D(tDiffuse, vUv + dir*3.0)*0.0540;' +
      ' s += texture2D(tDiffuse, vUv + dir*4.0)*0.0162;' +
      ' gl_FragColor = s; }',
    depthTest:false, depthWrite:false
  });
  mCopy = new THREE.ShaderMaterial({
    uniforms:{tDiffuse:{value:null}},
    vertexShader:VERT,
    fragmentShader:'uniform sampler2D tDiffuse; varying vec2 vUv;' +
      'void main(){ gl_FragColor = texture2D(tDiffuse, vUv); }',
    depthTest:false, depthWrite:false
  });
  mComp = new THREE.ShaderMaterial({
    uniforms:{tBloom:{value:null}, strength:{value:0.9}},
    vertexShader:VERT,
    fragmentShader:'uniform sampler2D tBloom; uniform float strength; varying vec2 vUv;' +
      'void main(){ gl_FragColor = vec4(texture2D(tBloom, vUv).rgb * strength, 1.0); }',
    depthTest:false, depthWrite:false, transparent:true, blending:THREE.AdditiveBlending
  });

  quadCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  quadScene = new THREE.Scene();
  quadMesh = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mCopy);
  quadMesh.frustumCulled = false;
  quadScene.add(quadMesh);
  bloomOK = true;
}catch(e){ bloomOK = false; }

window.addEventListener('resize', function(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if(bloomOK){
    renderer.getDrawingBufferSize(dbSize);
    rtScene.setSize(dbSize.x, dbSize.y);
    rtA.setSize(Math.max(2,dbSize.x>>1), Math.max(2,dbSize.y>>1));
    rtB.setSize(Math.max(2,dbSize.x>>1), Math.max(2,dbSize.y>>1));
  }
});

// ══════════════════════════════ 素材
function discTexture(){
  var s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
  var g=cv.getContext('2d');
  var grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0,'rgba(255,255,255,1)');
  grd.addColorStop(0.35,'rgba(255,255,255,0.5)');
  grd.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=grd; g.fillRect(0,0,s,s);
  var t=new THREE.Texture(cv); t.needsUpdate=true; return t;
}
var DISC = discTexture();

// ══════════════════════════════ 章
var CHAPTERS = [
  {no:'第一章', name:'蒼',   ring:0x78e6ff, aura:0x2e6f9c, grid:0x1d3a5c, fog:0x04060e},
  {no:'第二章', name:'翠',   ring:0x7dffc2, aura:0x2c8a63, grid:0x1a4a3c, fog:0x040e0b},
  {no:'第三章', name:'金',   ring:0xffd27a, aura:0x8a6a2c, grid:0x4a3c1a, fog:0x0e0a04},
  {no:'第四章', name:'緋',   ring:0xff8f9f, aura:0x8a2c46, grid:0x4a1a2c, fog:0x0e0409},
  {no:'終章',   name:'白夜', ring:0xf2f8ff, aura:0x7d8ca0, grid:0x3a4658, fog:0x080a12}
];
var chapIdx = 0;

// ══════════════════════════════ 星・塵
var STARS = 560;
var starGeo = new THREE.BufferGeometry();
(function(){
  var p = new Float32Array(STARS*3);
  for(var i=0;i<STARS;i++){
    p[i*3]=(Math.random()-0.5)*230; p[i*3+1]=(Math.random()-0.5)*150; p[i*3+2]=-Math.random()*620;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(p,3));
})();
var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  size:1.0, map:DISC, color:0x9fc8ff, transparent:true, opacity:0.85,
  depthWrite:false, blending:THREE.AdditiveBlending, fog:true}));
scene.add(stars);

// ══════════════════════════════ 回廊
var CELL = 8, SPAN = 500;
var gridMat = new THREE.LineBasicMaterial({color:0x1d3a5c, transparent:true, opacity:0.6, fog:true});
var gridGroup = new THREE.Group();
(function(){
  var pts=[];
  for(var z=0;z>-SPAN;z-=CELL){ pts.push(-64,-10,z,64,-10,z); pts.push(-64,10,z,64,10,z); }
  for(var x=-64;x<=64;x+=CELL){ pts.push(x,-10,0,x,-10,-SPAN); pts.push(x,10,0,x,10,-SPAN); }
  var g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  gridGroup.add(new THREE.LineSegments(g, gridMat));
})();
scene.add(gridGroup);

// ══════════════════════════════ 機体
var ship = new THREE.Group();
var shipHalo, shipEdge;
(function(){
  var cone = new THREE.ConeGeometry(0.5, 1.7, 4);
  var body = new THREE.Mesh(cone, new THREE.MeshBasicMaterial({color:0x0b1526}));
  body.rotation.x = -Math.PI/2; body.rotation.y = Math.PI/4;
  ship.add(body);
  shipEdge = new THREE.LineSegments(new THREE.EdgesGeometry(cone),
    new THREE.LineBasicMaterial({color:0xdff3ff, transparent:true, opacity:1, fog:false}));
  shipEdge.rotation.x = -Math.PI/2; shipEdge.rotation.y = Math.PI/4;
  ship.add(shipEdge);
  var wing = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(2.1,0.02,0.5)),
    new THREE.LineBasicMaterial({color:0x8fd8ff, transparent:true, opacity:0.55, fog:false}));
  wing.position.z = 0.35; ship.add(wing);
  shipHalo = new THREE.Sprite(new THREE.SpriteMaterial({map:DISC, color:0x78e6ff,
    transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false}));
  shipHalo.scale.set(3.6,3.6,1); shipHalo.position.z = 0.8;
  ship.add(shipHalo);
})();
scene.add(ship);

// ══════════════════════════════ 光の尾
var TRAIL = 170;
var trailPos = new Float32Array(TRAIL*3), trailCol = new Float32Array(TRAIL*3);
var trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol,3));
scene.add(new THREE.Points(trailGeo, new THREE.PointsMaterial({
  size:0.55, map:DISC, vertexColors:true, transparent:true,
  depthWrite:false, blending:THREE.AdditiveBlending, fog:true})));
var trailHead = 0;

// ══════════════════════════════ 飛沫
var SPARKS = 1100;
var spPos=new Float32Array(SPARKS*3), spCol=new Float32Array(SPARKS*3),
    spVel=new Float32Array(SPARKS*3), spLife=new Float32Array(SPARKS);
var spGeo = new THREE.BufferGeometry();
spGeo.setAttribute('position', new THREE.BufferAttribute(spPos,3));
spGeo.setAttribute('color', new THREE.BufferAttribute(spCol,3));
scene.add(new THREE.Points(spGeo, new THREE.PointsMaterial({
  size:0.46, map:DISC, vertexColors:true, transparent:true,
  depthWrite:false, blending:THREE.AdditiveBlending, fog:true})));
var spHead = 0;

function burst(x,y,z,n,r,g,b,power){
  for(var i=0;i<n;i++){
    var k=spHead; spHead=(spHead+1)%SPARKS;
    var a=Math.random()*Math.PI*2, rad=0.3+Math.random()*0.9;
    spPos[k*3]=x+Math.cos(a)*rad; spPos[k*3+1]=y+Math.sin(a)*rad; spPos[k*3+2]=z;
    spVel[k*3]=Math.cos(a)*power*(0.5+Math.random());
    spVel[k*3+1]=Math.sin(a)*power*(0.5+Math.random());
    spVel[k*3+2]=(Math.random()*0.6+0.35)*13;
    spCol[k*3]=r; spCol[k*3+1]=g; spCol[k*3+2]=b;
    spLife[k]=0.7+Math.random()*0.5;
  }
}

// ══════════════════════════════ 衝撃波
var WAVES = 8, waves = [];
(function(){
  for(var i=0;i<WAVES;i++){
    var m = new THREE.Mesh(
      new THREE.TorusGeometry(1, 0.05, 6, 44),
      new THREE.MeshBasicMaterial({color:0xffd27a, transparent:true, opacity:0,
        blending:THREE.AdditiveBlending, depthWrite:false, fog:true}));
    m.visible = false; scene.add(m);
    waves.push({mesh:m, life:0});
  }
})();
var waveHead = 0;
function shockwave(x,y,color){
  var w = waves[waveHead]; waveHead = (waveHead+1)%WAVES;
  w.mesh.position.set(x,y,0); w.mesh.scale.setScalar(1);
  w.mesh.material.color.setHex(color);
  w.mesh.visible = true; w.life = 1;
}

// ══════════════════════════════ 環
var RING_R = 3.3, GAP = 29, RING_N = 22;
var rings = [];
var lastRX = 0, lastRY = 0;

function makeRing(){
  var grp = new THREE.Group();
  var core = new THREE.Mesh(new THREE.TorusGeometry(RING_R, 0.11, 8, 56),
    new THREE.MeshBasicMaterial({color:0x78e6ff, transparent:true, opacity:0.95,
      blending:THREE.AdditiveBlending, depthWrite:false, fog:true}));
  var aura = new THREE.Mesh(new THREE.TorusGeometry(RING_R, 0.45, 8, 36),
    new THREE.MeshBasicMaterial({color:0x2e6f9c, transparent:true, opacity:0.3,
      blending:THREE.AdditiveBlending, depthWrite:false, fog:true}));
  var bar = new THREE.Mesh(new THREE.BoxGeometry(RING_R*2, 0.34, 0.16),
    new THREE.MeshBasicMaterial({color:0xbfe9ff, transparent:true, opacity:0.9,
      blending:THREE.AdditiveBlending, depthWrite:false, fog:true}));
  bar.visible = false;
  var seal = new THREE.Mesh(new THREE.CircleGeometry(2.55, 40),
    new THREE.MeshBasicMaterial({color:0x5a0f1c, transparent:true, opacity:0.82,
      side:THREE.DoubleSide, fog:true}));
  var sealEdge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.CircleGeometry(2.55, 40)),
    new THREE.LineBasicMaterial({color:0xff6a6a, transparent:true, opacity:0.9, fog:true}));
  seal.visible = false; sealEdge.visible = false;
  var eye = new THREE.Sprite(new THREE.SpriteMaterial({map:DISC, color:0xffd27a,
    transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false}));
  eye.scale.set(1.6,1.6,1);
  grp.add(core); grp.add(aura); grp.add(bar); grp.add(seal); grp.add(sealEdge); grp.add(eye);
  scene.add(grp);
  return {group:grp, core:core, aura:aura, bar:bar, seal:seal, sealEdge:sealEdge, eye:eye,
          type:'std', passed:false, hit:0, spin:1};
}

function pickType(n){
  if(n < 6) return 'std';
  var r = Math.random();
  var barW  = clamp(0.10 + n*0.004, 0, 0.26);
  var sealW = clamp(0.04 + n*0.004, 0, 0.22);
  var goldW = 0.09;
  if(r < goldW) return 'gold';
  if(r < goldW + barW) return 'bar';
  if(r < goldW + barW + sealW) return 'seal';
  return 'std';
}

function paintRing(o){
  var ch = CHAPTERS[chapIdx];
  o.bar.visible = (o.type==='bar');
  o.seal.visible = o.sealEdge.visible = (o.type==='seal');
  if(o.type==='gold'){
    o.core.material.color.setHex(0xffd27a); o.aura.material.color.setHex(0x8a6a2c);
    o.core.material.opacity = 1;
  }else if(o.type==='seal'){
    o.core.material.color.setHex(0xff6a6a); o.aura.material.color.setHex(0x8a2c46);
    o.core.material.opacity = 0.9;
  }else{
    o.core.material.color.setHex(ch.ring); o.aura.material.color.setHex(ch.aura);
    o.core.material.opacity = 0.95;
  }
  if(o.type==='bar') o.bar.material.color.setHex(ch.ring);
}

function placeRing(o, z, n){
  lastRX = clamp(lastRX + (Math.random()*2-1)*3.8, -4.7, 4.7);
  lastRY = clamp(lastRY + (Math.random()*2-1)*2.6, -3.1, 3.1);
  o.group.position.set(lastRX, lastRY, z);
  o.group.rotation.z = Math.random()*Math.PI;
  o.group.scale.setScalar(1);
  o.type = pickType(n);
  o.spin = (Math.random()<0.5?-1:1) * (0.9 + Math.random()*1.1);
  o.bar.rotation.z = Math.random()*Math.PI;
  o.passed = false; o.hit = 0;
  paintRing(o);
}

for(var ri=0; ri<RING_N; ri++){ var ro = makeRing(); placeRing(ro, -GAP*(ri+1), 0); rings.push(ro); }

// ══════════════════════════════ 音
var actx=null, muted=false;
function tone(freq,dur,type,vol,delay){
  if(muted) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var t0 = actx.currentTime + (delay||0);
    var o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0+dur);
  }catch(e){}
}

// ══════════════════════════════ 状態
var S = {mode:'title', score:0, combo:0, maxCombo:0, cores:0, grazes:0,
         lamp:100, speed:34, passed:0, shake:0, t:0, slow:0, wound:0, fov:72};
var px=0,py=0,tx=0,ty=0;
var MAXX=5.6, MAXY=3.9;
var SLOW_COST=20, SLOW_TIME=2.6;

// ══════════════════════════════ UI 参照
var elHud=document.getElementById('hud'), elVeil=document.getElementById('veil'),
    elBody=document.getElementById('veilBody'), elScore=document.getElementById('scoreN'),
    elCombo=document.getElementById('combo'), elComboN=document.getElementById('comboN'),
    elLamp=document.getElementById('lampFill'), elCall=document.getElementById('call'),
    elBan=document.getElementById('banner'), elChap=document.getElementById('chapter'),
    elSlow=document.getElementById('slowBtn'), elTint=document.getElementById('tint'),
    elWound=document.getElementById('wound');

function call(t,color){
  elCall.textContent = t;
  elCall.style.color = color || '#ffd27a';
  elCall.classList.remove('pop'); void elCall.offsetWidth; elCall.classList.add('pop');
}
function banner(t){
  elBan.textContent = t;
  elBan.classList.remove('show'); void elBan.offsetWidth; elBan.classList.add('show');
}

document.getElementById('mute').addEventListener('click', function(){
  muted = !muted; this.textContent = muted ? '✕' : '♪';
  this.style.color = muted ? '#4a5a70' : '';
});

// ══════════════════════════════ 入力
var keys = {};
window.addEventListener('keydown', function(e){
  keys[e.key]=true;
  if(e.key===' '){ e.preventDefault(); if(S.mode==='play') useSlow(); else start(); }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.key)>=0) e.preventDefault();
});
window.addEventListener('keyup', function(e){ keys[e.key]=false; });

var dragging=false, dx0=0, dy0=0, dtx=0, dty=0;
canvas.addEventListener('pointerdown', function(e){
  dragging=true; dx0=e.clientX; dy0=e.clientY; dtx=tx; dty=ty;
});
window.addEventListener('pointerup', function(){ dragging=false; });
window.addEventListener('pointercancel', function(){ dragging=false; });
window.addEventListener('pointermove', function(e){
  if(S.mode!=='play') return;
  if(dragging){
    var k = 2.6/Math.min(window.innerWidth,900);
    tx = clamp(dtx + (e.clientX-dx0)*k*MAXX, -MAXX, MAXX);
    ty = clamp(dty - (e.clientY-dy0)*k*MAXY*1.5, -MAXY, MAXY);
  }else if(e.pointerType==='mouse'){
    tx = clamp((e.clientX/window.innerWidth*2-1)*MAXX, -MAXX, MAXX);
    ty = clamp((1-e.clientY/window.innerHeight*2)*MAXY, -MAXY, MAXY);
  }
});
elSlow.addEventListener('click', function(e){ e.stopPropagation(); useSlow(); });

function useSlow(){
  if(S.mode!=='play' || S.slow>0 || S.lamp <= SLOW_COST+2) return;
  S.lamp -= SLOW_COST; S.slow = SLOW_TIME;
  elTint.classList.add('slow');
  call('残光','#78e6ff');
  tone(520,0.5,'sine',0.12); tone(346,0.6,'sine',0.1,0.04);
}

// ══════════════════════════════ 進行
function setChapter(i){
  chapIdx = Math.min(i, CHAPTERS.length-1);
  var ch = CHAPTERS[chapIdx];
  scene.fog.color.setHex(ch.fog);
  renderer.setClearColor(ch.fog, 1);
  gridMat.color.setHex(ch.grid);
  for(var r=0;r<rings.length;r++) paintRing(rings[r]);
  elChap.textContent = ch.no + ' ' + ch.name;
}

function bindStart(){ var b=document.getElementById('go'); if(b) b.addEventListener('click', start); }
bindStart();

function start(){
  S.mode='play'; S.score=0; S.combo=0; S.maxCombo=0; S.cores=0; S.grazes=0;
  S.lamp=100; S.speed=34; S.passed=0; S.shake=0; S.slow=0; S.wound=0;
  px=py=tx=ty=0; lastRX=0; lastRY=0;
  setChapter(0);
  for(var i=0;i<rings.length;i++) placeRing(rings[i], -GAP*(i+1), 0);
  for(var j=0;j<TRAIL;j++){ trailPos[j*3]=0; trailPos[j*3+1]=0; trailPos[j*3+2]=60; }
  for(var k=0;k<SPARKS;k++){ spLife[k]=0; spCol[k*3]=spCol[k*3+1]=spCol[k*3+2]=0; }
  for(var w=0;w<WAVES;w++){ waves[w].life=0; waves[w].mesh.visible=false; }
  elScore.textContent='0'; elCombo.classList.add('hide');
  elLamp.style.width='100%'; elLamp.classList.remove('low');
  elTint.classList.remove('slow'); elWound.style.opacity=0;
  elVeil.classList.add('gone'); elHud.classList.add('on');
  banner('第一章 蒼');
  tone(220,0.2,'triangle',0.12); tone(330,0.3,'sine',0.08,0.08);
}

function over(){
  S.mode='over';
  elHud.classList.remove('on');
  elTint.classList.remove('slow');
  burst(px,py,0,90,1,0.5,0.4,14);
  elBody.innerHTML =
    '<div class="kanji">終燈</div><div class="roman">LIGHTS OUT</div><div class="rule"></div>' +
    '<div class="stats">' +
      '<div class="stat"><div class="lbl">光</div><div class="num">'+S.score+'</div></div>' +
      '<div class="stat"><div class="lbl">最大連</div><div class="num">×'+S.maxCombo+'</div></div>' +
      '<div class="stat"><div class="lbl">芯</div><div class="num">'+S.cores+'</div></div>' +
      '<div class="stat"><div class="lbl">掠</div><div class="num">'+S.grazes+'</div></div>' +
    '</div>' +
    '<div class="lede" style="margin-top:22px;font-size:12px;color:#8fa3c0">到達 '+
      CHAPTERS[chapIdx].no+' '+CHAPTERS[chapIdx].name+' ／ 環 '+S.passed+'</div>' +
    '<button class="act" id="go">もう一度</button>';
  elVeil.classList.remove('gone');
  bindStart();
  tone(150,0.7,'sine',0.16); tone(100,0.9,'sine',0.12,0.1);
}

function damage(amount, x, y){
  S.combo = 0;
  S.lamp -= amount;
  S.shake = 0.6;
  S.wound = 1;
  elCombo.classList.add('hide');
  burst(x, y, 0, 24, 1.0, 0.3, 0.3, 6);
  tone(140,0.3,'sawtooth',0.15);
  if(S.lamp <= 0){ S.lamp = 0; over(); }
}

function award(gain, lamp){
  S.score += gain; S.lamp = Math.min(100, S.lamp + lamp);
  elScore.textContent = S.score;
}

// ══════════════════════════════ ループ
var clock = new THREE.Clock();

function frame(){
  requestAnimationFrame(frame);
  var raw = Math.min(clock.getDelta(), 0.05);
  S.t += raw;

  // 残光
  var scale = 1;
  if(S.slow > 0){
    S.slow -= raw;
    scale = 0.42;
    if(S.slow <= 0){ S.slow = 0; elTint.classList.remove('slow'); }
  }
  var dt = raw * scale;
  var speed = (S.mode==='play') ? S.speed : 11;

  // 舵
  if(S.mode==='play'){
    var kx=0, ky=0;
    if(keys.ArrowLeft||keys.a||keys.A) kx-=1;
    if(keys.ArrowRight||keys.d||keys.D) kx+=1;
    if(keys.ArrowUp||keys.w||keys.W) ky+=1;
    if(keys.ArrowDown||keys.s||keys.S) ky-=1;
    if(kx||ky){
      tx = clamp(tx + kx*15*raw, -MAXX, MAXX);
      ty = clamp(ty + ky*11*raw, -MAXY, MAXY);
    }
    var vx=tx-px, vy=ty-py;
    px += vx*Math.min(1, raw*9); py += vy*Math.min(1, raw*9);
    ship.position.set(px,py,0);
    ship.rotation.z = clamp(-vx*0.3, -0.75, 0.75);
    ship.rotation.x = clamp(vy*0.2, -0.45, 0.45);
    shipHalo.material.opacity = 0.55 + Math.sin(S.t*8)*0.15 + (S.slow>0?0.2:0);
    shipHalo.scale.setScalar(3.2 + Math.sin(S.t*8)*0.3);

    S.lamp -= dt*1.5;
    if(S.lamp <= 0){ S.lamp = 0; over(); }
    S.speed = 34 + Math.min(34, S.passed*0.42);

    var canSlow = (S.lamp > SLOW_COST+2 && S.slow<=0);
    elSlow.classList.toggle('cold', !canSlow);
    elSlow.classList.toggle('ready', canSlow);
  }

  // 星
  var sp = starGeo.attributes.position;
  for(var i=0;i<STARS;i++){
    sp.array[i*3+2] += speed*dt*0.55;
    if(sp.array[i*3+2] > 12){
      sp.array[i*3+2] -= 620;
      sp.array[i*3]=(Math.random()-0.5)*230; sp.array[i*3+1]=(Math.random()-0.5)*150;
    }
  }
  sp.needsUpdate = true;
  gridGroup.position.z = (gridGroup.position.z + speed*dt) % CELL;

  // 環
  for(var r=0;r<rings.length;r++){
    var o=rings[r], gp=o.group, prevZ=gp.position.z;
    gp.position.z += speed*dt;
    gp.rotation.z += dt*0.22;
    if(o.type==='bar') o.bar.rotation.z += dt*o.spin*1.5;

    if(o.hit > 0){
      o.hit -= raw*2.4;
      var f=Math.max(0,o.hit);
      o.core.material.opacity = 0.25 + f*0.9;
      gp.scale.setScalar(1 + (1-Math.min(1,f))*0.28);
    }

    if(S.mode==='play' && !o.passed && prevZ < 0 && gp.position.z >= 0){
      o.passed = true;
      var ddx = px-gp.position.x, ddy = py-gp.position.y;
      var d = Math.sqrt(ddx*ddx+ddy*ddy);

      if(o.type==='seal'){
        if(d < 2.55+0.45){
          damage(30, px, py); call('封','#ff6a6a');
        }else{
          var graze = d < 4.4;
          if(graze){ S.grazes++; S.combo++; }
          var gm = Math.min(8, 1+Math.floor(S.combo/3));
          award(graze ? 260*gm : 0, graze ? 3 : 0);
          if(graze){
            call('掠','#ff9fb0');
            shockwave(gp.position.x, gp.position.y, 0xff8fa0);
            burst(px,py,0,18,1.0,0.55,0.62,6);
            tone(300+gm*40,0.12,'square',0.07);
            elComboN.textContent='×'+gm; elCombo.classList.toggle('hide', S.combo<3);
          }
        }
      }else if(d < RING_R-0.5){
        var barHit = false;
        if(o.type==='bar'){
          var a = o.bar.rotation.z + gp.rotation.z;
          var perp = Math.abs(ddx*(-Math.sin(a)) + ddy*Math.cos(a));
          barHit = perp < 0.62;
        }
        if(barHit){
          damage(24, px, py); call('閂','#ff6a6a');
        }else{
          S.passed++; S.combo++;
          if(S.combo > S.maxCombo) S.maxCombo = S.combo;
          var mult = Math.min(8, 1+Math.floor(S.combo/3));
          var core = d < 1.05;
          if(core) S.cores++;
          var base = (o.type==='gold') ? 400 : 100;
          award(base*mult*(core?2:1), (o.type==='gold'?14:(core?8:5)));
          o.hit = 1;
          elComboN.textContent = '×'+mult;
          elCombo.classList.toggle('hide', S.combo<3);

          if(o.type==='gold'){
            burst(gp.position.x,gp.position.y,0,58,1.0,0.82,0.4,10);
            shockwave(gp.position.x,gp.position.y,0xffd27a);
            call('金環','#ffd27a');
            tone(523,0.22,'triangle',0.14); tone(784,0.26,'sine',0.1,0.05);
            tone(1046,0.3,'sine',0.08,0.1);
          }else if(core){
            burst(gp.position.x,gp.position.y,0,44,1.0,0.85,0.45,9);
            shockwave(gp.position.x,gp.position.y,0xffe6a8);
            call('芯','#ffd27a');
            tone(660+mult*70,0.2,'triangle',0.15);
            tone(990+mult*70,0.26,'sine',0.08,0.03);
          }else{
            burst(gp.position.x,gp.position.y,0,24,0.45,0.9,1.0,7);
            tone(440+mult*55,0.12,'triangle',0.11);
          }

          // 章の進行
          var want = Math.min(CHAPTERS.length-1, Math.floor(S.passed/18));
          if(want !== chapIdx){
            setChapter(want);
            banner(CHAPTERS[chapIdx].no + ' ' + CHAPTERS[chapIdx].name);
            S.lamp = Math.min(100, S.lamp+12);
            tone(392,0.4,'sine',0.1); tone(587,0.5,'sine',0.08,0.1);
          }
        }
      }else{
        damage(26, px, py); call('外','#ff6a6a');
      }
    }

    if(gp.position.z > 14){
      o.core.material.opacity = 0.95;
      placeRing(o, gp.position.z - GAP*RING_N, S.passed);
    }
    o.eye.material.opacity = (gp.position.z > -GAP*1.5 && gp.position.z < 0) ? 0.7 : 0;
  }

  // 衝撃波
  for(var wv=0;wv<WAVES;wv++){
    var W = waves[wv];
    if(W.life > 0){
      W.life -= raw*1.6;
      var lf = Math.max(0, W.life);
      W.mesh.scale.setScalar(1 + (1-lf)*7);
      W.mesh.position.z += speed*dt;
      W.mesh.material.opacity = lf*0.75;
      if(W.life<=0) W.mesh.visible=false;
    }
  }

  // 尾
  trailHead = (trailHead+1)%TRAIL;
  trailPos[trailHead*3]=px; trailPos[trailHead*3+1]=py; trailPos[trailHead*3+2]=0.9;
  var tc = CHAPTERS[chapIdx];
  var cr = ((tc.ring>>16)&255)/255, cg = ((tc.ring>>8)&255)/255, cb = (tc.ring&255)/255;
  for(var t2=0;t2<TRAIL;t2++){
    if(t2!==trailHead) trailPos[t2*3+2] += speed*dt;
    var age=(trailHead-t2+TRAIL)%TRAIL, f2=1-age/TRAIL; f2=f2*f2;
    trailCol[t2*3]=cr*f2; trailCol[t2*3+1]=cg*f2; trailCol[t2*3+2]=cb*f2;
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;

  // 飛沫
  for(var s2=0;s2<SPARKS;s2++){
    if(spLife[s2] > 0){
      spLife[s2] -= raw;
      spPos[s2*3]   += spVel[s2*3]*dt;
      spPos[s2*3+1] += spVel[s2*3+1]*dt;
      spPos[s2*3+2] += (spVel[s2*3+2]+speed)*dt;
      spVel[s2*3]*=0.96; spVel[s2*3+1]*=0.96;
      spCol[s2*3]*=0.965; spCol[s2*3+1]*=0.965; spCol[s2*3+2]*=0.965;
      if(spLife[s2] <= 0){ spCol[s2*3]=spCol[s2*3+1]=spCol[s2*3+2]=0; }
    }
  }
  spGeo.attributes.position.needsUpdate = true;
  spGeo.attributes.color.needsUpdate = true;

  // ゲージ・被弾表現
  if(S.mode==='play'){
    elLamp.style.width = S.lamp.toFixed(1)+'%';
    elLamp.classList.toggle('low', S.lamp<34);
  }
  if(S.wound > 0){
    S.wound -= raw*2.2;
    elWound.style.opacity = Math.max(0, S.wound)*0.9;
  }

  // カメラ
  if(S.shake > 0) S.shake -= raw*1.7;
  var sh = Math.max(0, S.shake);
  var wantFov = 72 + (S.mode==='play' ? Math.min(10,(S.speed-34)*0.32) : 0) - (S.slow>0?7:0);
  S.fov += (wantFov - S.fov)*Math.min(1, raw*3);
  camera.fov = S.fov; camera.updateProjectionMatrix();
  camera.position.x = px*0.42 + (Math.random()-0.5)*sh*1.4;
  camera.position.y = 1.0 + py*0.36 + (Math.random()-0.5)*sh*1.4;
  camera.rotation.z = 0;
  camera.lookAt(px*0.7, py*0.7+0.4, -16);
  camera.rotation.z += clamp(-(tx-px)*0.05, -0.08, 0.08);

  // 描画
  if(bloomOK){
    mComp.uniforms.strength.value = 0.85 + (S.slow>0?0.4:0) + Math.max(0,S.shake)*0.3;
    renderer.setRenderTarget(rtScene); renderer.clear(); renderer.render(scene, camera);
    quadMesh.material = mBright; mBright.uniforms.tDiffuse.value = rtScene.texture;
    renderer.setRenderTarget(rtA); renderer.clear(); renderer.render(quadScene, quadCam);
    quadMesh.material = mBlur;
    mBlur.uniforms.tDiffuse.value = rtA.texture;
    mBlur.uniforms.dir.value.set(1.4/Math.max(2,dbSize.x>>1), 0);
    renderer.setRenderTarget(rtB); renderer.clear(); renderer.render(quadScene, quadCam);
    mBlur.uniforms.tDiffuse.value = rtB.texture;
    mBlur.uniforms.dir.value.set(0, 1.4/Math.max(2,dbSize.y>>1));
    renderer.setRenderTarget(rtA); renderer.clear(); renderer.render(quadScene, quadCam);
    renderer.setRenderTarget(null); renderer.clear();
    quadMesh.material = mCopy; mCopy.uniforms.tDiffuse.value = rtScene.texture;
    renderer.render(quadScene, quadCam);
    quadMesh.material = mComp; mComp.uniforms.tBloom.value = rtA.texture;
    renderer.render(quadScene, quadCam);
  }else{
    renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera);
  }
}
frame();

})();
</script>
</body>
